---
openapi: 3.1.0
info:
  title: 'WhatsApp Cloud API - Message API'
  version: v25.0
  description: |
    Send and receive WhatsApp messages including text, media, templates,
    interactive messages, reactions, and more. Supports message status
    tracking, delivery receipts, and read confirmations.
  contact: { }
servers:
  - 
    url: https://graph.facebook.com
tags:
  - 
    name: Messages
    description: 'Use the **`/{{Phone-Number-ID}}/messages`** endpoint to send text messages, media (audio, documents, images, and video), and message templates to your customers. For more information relating to the messages you can send, see [Messages](#1f4f7644-cc97-40b5-b8e4-c19da268fff1).\n\nMessages are identified by a unique ID. You can track message status in the Webhooks through its ID. You could also mark an incoming message as read through the **`/{{Phone-Number-ID}}/messages`** endpoint.\n\n## Prerequisites\n\n*   [User Access Token](https://developers.facebook.com/docs/facebook-login/access-tokens#usertokens) with **`whatsapp_business_messaging`** permission\n*   `phone-number-id` for your registered WhatsApp account. See [Get Phone Number](#c72d9c17-554d-4ae1-8f9e-b28a94010b28).'
  - 
    name: Examples
